events {}

http {
  server {
    listen 80;

    # ---- AUTH ROUTES ----
    location /auth/ {
      proxy_pass http://user-service:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
    }

    # ---- USER ROUTES ----
    location /user/ {
      proxy_pass http://user-service:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
    }
  }
}
