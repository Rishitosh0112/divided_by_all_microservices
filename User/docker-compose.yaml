version: '3.9'

services:
  user-service:
    build:
      context: .
    container_name: user-service
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: ${MONGO_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - devtinder-net

networks:
  devtinder-net:
    external: true