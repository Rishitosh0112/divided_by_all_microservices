version: "3.9"

services:
  group-db:
    image: postgres:15
    container_name: group-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: group_service
    ports:
      - "5434:5432"
    volumes:
      - group-db-data:/var/lib/postgresql/data

  group-service:
    build: .
    container_name: group-service
    restart: always
    ports:
      - "4002:4002"
    depends_on:
      - group-db
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@group-db:5432/group_service"
    volumes:
      - .:/app
      
volumes:
  group-db-data: