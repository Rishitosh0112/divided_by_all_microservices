version: "3.8"

services:
  group-db:
    image: postgres:15
    container_name: group-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: group_service_db
    ports:
      - "5434:5432"
    volumes:
      - group_pg_data:/var/lib/postgresql/data

volumes:
  group_pg_data: