name: Build and Push Backend Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::389656351866:role/GitHubActionsMicroservicesEcrRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push user-service image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/divided-by-all/user-service:$IMAGE_TAG" ./User
          docker push "$REGISTRY/divided-by-all/user-service:$IMAGE_TAG"

      - name: Build and push groups-service image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/divided-by-all/groups-service:$IMAGE_TAG" ./groups-service
          docker push "$REGISTRY/divided-by-all/groups-service:$IMAGE_TAG"

      - name: Build and push api-gateway image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/divided-by-all/api-gateway:$IMAGE_TAG" ./api-gateway
          docker push "$REGISTRY/divided-by-all/api-gateway:$IMAGE_TAG"
